<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mesaj — Android 15 (Galaxy S24 Ultra / Pixel 9) Canlı PC Simülatörü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(circle at 50% 18%, #0d2b24 0%, #060b10 75%);
    color: #eef2f5;
    font-family: 'Inter', Roboto, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 20px 28px;
    overflow-x: hidden;
  }

  /* Üst Kontrol Çubuğu */
  .sim-toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(15, 26, 34, 0.94);
    border: 1px solid rgba(61, 220, 132, 0.25);
    padding: 10px 18px;
    border-radius: 16px;
    margin-bottom: 18px;
    flex-wrap: wrap;
    justify-content: center;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
  }
  .sim-brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    font-size: 14px;
    color: #3ddc84;
    padding-right: 12px;
    border-right: 1px solid rgba(255, 255, 255, 0.12);
  }
  .sim-brand span.and-logo {
    font-size: 18px;
  }
  .sim-btn {
    padding: 7px 13px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.05);
    color: #d1dce5;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.15s;
  }
  .sim-btn:hover {
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
  }
  .sim-btn.active {
    background: #00a884;
    border-color: #3ddc84;
    color: #fff;
    box-shadow: 0 0 14px rgba(61, 220, 132, 0.35);
  }

  /* Sahne */
  .sim-stage {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;
    flex-wrap: wrap;
    width: 100%;
  }

  /* Samsung Galaxy S24 Ultra / Pixel 9 Pro Kasa */
  .android-shell {
    position: relative;
    width: 406px;
    height: 846px;
    border-radius: 26px;
    background: #14181d;
    padding: 10px;
    box-shadow:
      0 0 0 2px #3b424c,
      0 0 0 4px #181c22,
      0 28px 70px rgba(0, 0, 0, 0.8);
    transition: width 0.25s ease, height 0.25s ease, border-radius 0.25s ease;
    display: flex;
    flex-direction: column;
    user-select: none;
  }
  .android-shell.pixel-style {
    border-radius: 44px;
  }
  .android-shell.pixel-style .android-screen {
    border-radius: 35px;
  }

  /* Sağ Yan Ses ve Güç Tuşları (Android Standardı) */
  .android-shell::after {
    content: "";
    position: absolute;
    right: -6px;
    top: 150px;
    width: 3px;
    height: 76px;
    background: #464e59;
    border-radius: 0 3px 3px 0;
    box-shadow: 0 105px 0 -10px #464e59;
  }

  .android-screen {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 18px;
    overflow: hidden;
    background: #070d12;
    display: flex;
    flex-direction: column;
    transition: border-radius 0.25s ease;
  }

  /* Android 15 Üst Durum Çubuğu + Nokta Kamera (Punch-Hole) */
  .and-statusbar {
    height: 36px;
    background: #131f29;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    font-size: 12.5px;
    font-weight: 600;
    color: #e5ecf0;
    position: relative;
    z-index: 10;
    flex-shrink: 0;
  }
  .and-left {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .punch-hole {
    position: absolute;
    left: 50%;
    top: 8px;
    transform: translateX(-50%);
    width: 13px;
    height: 13px;
    background: radial-gradient(circle at 35% 35%, #243b61, #04070d 70%);
    border: 1.5px solid #000;
    border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12);
  }
  .and-status-icons {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
  }
  .and-bat-pill {
    background: rgba(61, 220, 132, 0.2);
    border: 1px solid #3ddc84;
    color: #3ddc84;
    font-size: 10.5px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 6px;
  }

  /* Uygulama İframe Alanı */
  .and-app-frame {
    flex: 1;
    width: 100%;
    border: 0;
    background: #070d12;
  }

  /* Android Alt Gezinme Çubuğu (3 Tuş: Geri, Ana Ekran, Son Uygulamalar) */
  .and-navbar {
    height: 42px;
    background: #0b1218;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0 36px;
    flex-shrink: 0;
  }
  .and-nav-btn {
    background: none;
    border: none;
    color: rgba(255, 255, 255, 0.72);
    font-size: 16px;
    cursor: pointer;
    padding: 6px 18px;
    border-radius: 99px;
    transition: background 0.15s, color 0.15s;
  }
  .and-nav-btn:hover {
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
  }

  .device-label {
    text-align: center;
    font-size: 12px;
    color: #8fa1ad;
    margin-top: 10px;
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="sim-toolbar">
  <div class="sim-brand">
    <span class="and-logo">🤖</span>
    <span>Android 15 Simülatörü (Google Play)</span>
  </div>
  <button type="button" class="sim-btn active" onclick="setAndroidModel(406, 846, false, 'Samsung Galaxy S24 Ultra', this)">Galaxy S24 Ultra</button>
  <button type="button" class="sim-btn" onclick="setAndroidModel(396, 836, true, 'Google Pixel 9 Pro', this)">Google Pixel 9 Pro</button>
  <button type="button" class="sim-btn" onclick="setAndroidModel(384, 812, true, 'Xiaomi 14 Pro', this)">Xiaomi 14 Pro</button>
  <button type="button" class="sim-btn" onclick="setAndroidModel(768, 900, false, 'Galaxy Tab S9 Tablet', this)">Galaxy Tab S9</button>
  <button type="button" class="sim-btn" id="dual-btn" onclick="toggleDualAndroid()">📱📱 2. Android Ekranı Aç (Karşılıklı Test)</button>
  <button type="button" class="sim-btn" onclick="reloadFrames()">🔄 Yenile</button>
  <a href="iphone-simulator.html" class="sim-btn">🍎 iPhone Simülatörüne Geç</a>
</div>

<div class="sim-stage" id="sim-stage">
  <!-- 1. Android Telefon -->
  <div>
    <div class="android-shell" id="shell-1">
      <div class="android-screen">
        <div class="and-statusbar">
          <div class="and-left">
            <span class="and-clock">15:30</span>
            <span style="font-size:11px;opacity:0.8">💬</span>
          </div>
          <div class="punch-hole" title="Ön Kamera"></div>
          <div class="and-status-icons">
            <span>5G</span>
            <span>📶</span>
            <span class="and-bat-pill">98%</span>
          </div>
        </div>
        <iframe class="and-app-frame" id="frame-1" src="index.html?sim=android1" allow="camera; microphone; geolocation; clipboard-write"></iframe>
        <div class="and-navbar">
          <button type="button" class="and-nav-btn" title="Son Uygulamalar" onclick="reloadSingle('frame-1')">▢</button>
          <button type="button" class="and-nav-btn" title="Ana Ekran" onclick="triggerBack('frame-1')">◯</button>
          <button type="button" class="and-nav-btn" title="Geri" onclick="triggerBack('frame-1')">◁</button>
        </div>
      </div>
    </div>
    <div class="device-label" id="label-1">Android #1 — Samsung Galaxy S24 Ultra (com.mametech.mesaj)</div>
  </div>

  <!-- 2. Android Telefon (Karşılıklı Test İçin) -->
  <div id="second-device-wrap" style="display:none">
    <div class="android-shell" id="shell-2">
      <div class="android-screen">
        <div class="and-statusbar">
          <div class="and-left">
            <span class="and-clock">15:30</span>
            <span style="font-size:11px;opacity:0.8">💬</span>
          </div>
          <div class="punch-hole"></div>
          <div class="and-status-icons">
            <span>Wi-Fi</span>
            <span>📶</span>
            <span class="and-bat-pill">100%</span>
          </div>
        </div>
        <iframe class="and-app-frame" id="frame-2" src="about:blank" allow="camera; microphone; geolocation; clipboard-write"></iframe>
        <div class="and-navbar">
          <button type="button" class="and-nav-btn" title="Son Uygulamalar" onclick="reloadSingle('frame-2')">▢</button>
          <button type="button" class="and-nav-btn" title="Ana Ekran" onclick="triggerBack('frame-2')">◯</button>
          <button type="button" class="and-nav-btn" title="Geri" onclick="triggerBack('frame-2')">◁</button>
        </div>
      </div>
    </div>
    <div class="device-label" id="label-2">Android #2 — Karşı Taraf Test Cihazı</div>
  </div>
</div>

<script>
  function updateClocks() {
    const now = new Date();
    const t = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    document.querySelectorAll('.and-clock').forEach(el => { el.textContent = t; });
  }
  updateClocks();
  setInterval(updateClocks, 15000);

  function setAndroidModel(w, h, rounded, modelName, btn) {
    document.querySelectorAll('.sim-toolbar button.sim-btn').forEach(b => {
      if (b.id !== 'dual-btn') b.classList.remove('active');
    });
    btn.classList.add('active');
    document.querySelectorAll('.android-shell').forEach(s => {
      s.style.width = w + 'px';
      s.style.height = h + 'px';
      s.classList.toggle('pixel-style', rounded);
    });
    document.getElementById('label-1').textContent = `Android #1 — ${modelName} (com.mametech.mesaj)`;
  }

  let dualOpen = false;
  function toggleDualAndroid() {
    dualOpen = !dualOpen;
    const wrap = document.getElementById('second-device-wrap');
    const btn = document.getElementById('dual-btn');
    const f2 = document.getElementById('frame-2');
    wrap.style.display = dualOpen ? 'block' : 'none';
    btn.classList.toggle('active', dualOpen);
    if (dualOpen && f2.src === 'about:blank') {
      f2.src = 'index.html?sim=android2';
    }
  }

  function triggerBack(frameId) {
    try {
      const f = document.getElementById(frameId);
      const backBtn = f.contentDocument.getElementById('back-btn');
      if (backBtn && backBtn.offsetParent !== null) {
        backBtn.click();
      }
    } catch {}
  }

  function reloadSingle(frameId) {
    const f = document.getElementById(frameId);
    if (f && f.contentWindow) f.contentWindow.location.reload();
  }

  function reloadFrames() {
    reloadSingle('frame-1');
    if (dualOpen) reloadSingle('frame-2');
  }
</script>
</body>
</html>

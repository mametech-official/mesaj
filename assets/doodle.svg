  <g transform="translate(250, 270)">
    <rect class="d" x="8" y="2" width="8" height="14" rx="4" />
    <path class="d" d="M 4 10 A 8 8 0 0 0 20 10" />
    <path class="d" d="M 12 18 V 24 M 7 24 H 17" />
  </g>

  <!-- Star -->
  <g transform="translate(355, 270)">
    <path class="d" d="M 14 2 L 17.5 9.5 L 26 10.5 L 19.5 16.5 L 21.5 25 L 14 20.5 L 6.5 25 L 8.5 16.5 L 2 10.5 L 10.5 9.5 Z" />
  </g>

  <!-- Plant Leaf -->
  <g transform="translate(445, 275) rotate(20)">
    <path class="d" d="M 4 24 C 4 12 14 2 24 2 C 24 14 14 24 4 24 Z" />
    <path class="d" d="M 4 24 Q 14 14 24 2" />

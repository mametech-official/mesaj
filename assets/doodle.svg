<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <style>
      .d { fill: none; stroke: #ffffff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .f { fill: #ffffff; }
      .df { fill: #ffffff; stroke: #ffffff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Speech bubble with dots -->
  <g transform="translate(35, 30)">
    <path class="d" d="M 4 4 H 36 A 6 6 0 0 1 42 10 V 26 A 6 6 0 0 1 36 32 H 14 L 6 38 V 32 A 6 6 0 0 1 2 26 V 10 A 6 6 0 0 1 8 4" />
    <circle class="f" cx="14" cy="18" r="1.8" />
    <circle class="f" cx="22" cy="18" r="1.8" />
    <circle class="f" cx="30" cy="18" r="1.8" />
  </g>

  <!-- Coffee cup with steam -->
  <g transform="translate(150, 25)">
    <path class="d" d="M 6 10 H 26 V 22 A 6 6 0 0 1 20 28 H 12 A 6 6 0 0 1 6 22 Z" />
    <path class="d" d="M 26 13 H 29 A 3 3 0 0 1 32 16 V 18 A 3 3 0 0 1 29 21 H 26" />
    <path class="d" d="M 4 28 H 28" />
    <path class="d" d="M 11 3 Q 10 6 11 8" />
    <path class="d" d="M 16 2 Q 15 5 16 7" />
    <path class="d" d="M 21 3 Q 20 6 21 8" />
  </g>

  <!-- Musical note -->
  <g transform="translate(265, 30)">
    <path class="d" d="M 8 26 A 4 4 0 1 1 5 22 L 18 5 V 20 A 4 4 0 1 1 15 16" />
    <path class="d" d="M 18 8 L 26 6 V 10 L 18 12" />
  </g>

  <!-- Heart -->
  <g transform="translate(365, 35)">
    <path class="d" d="M 16 28 L 14.5 26.6 C 7 19.8 2 15.2 2 9.5 C 2 4.8 5.7 1.2 10.4 1.2 C 13 1.2 15.5 2.4 16 4.3 C 16.5 2.4 19 1.2 21.6 1.2 C 26.3 1.2 30 4.8 30 9.5 C 30 15.2 25 19.8 17.5 26.6 Z" />
  </g>

  <!-- Clock -->
  <g transform="translate(445, 30)">
    <circle class="d" cx="16" cy="16" r="14" />
    <path class="d" d="M 16 8 V 16 L 21 19" />
  </g>

  <!-- Camera -->
  <g transform="translate(80, 115)">

  <!-- Paperclip / Attachment -->
  <g transform="translate(405, 435) rotate(45)">
    <path class="d" d="M 6 12 V 6 A 4 4 0 0 1 14 6 V 15 A 3 3 0 0 1 8 15 V 7" />
  </g>

  <!-- Decorative sparkles, stars and bubbles scattered across gaps -->
  <!-- Row 1 gaps -->
  <g transform="translate(105, 45)"><path class="d" d="M 6 1 V 11 M 1 6 H 11" /><circle class="f" cx="6" cy="6" r="0.8" /></g>
  <g transform="translate(225, 45)"><circle class="f" cx="4" cy="4" r="1.8" /></g>
  <g transform="translate(330, 40)"><circle class="f" cx="3" cy="3" r="1.3" /><circle class="f" cx="10" cy="8" r="0.9" /></g>
  <g transform="translate(420, 40)"><path class="d" d="M 4 1 V 7 M 1 4 H 7" /></g>

  <!-- Row 2 gaps -->
  <g transform="translate(35, 125)"><circle class="f" cx="3" cy="3" r="1.5" /></g>
  <g transform="translate(150, 125)"><circle class="f" cx="4" cy="4" r="1.3" /><circle class="f" cx="12" cy="6" r="2" /></g>
  <g transform="translate(265, 125)"><path class="d" d="M 5 1 V 9 M 1 5 H 9" /></g>
  <g transform="translate(365, 125)"><circle class="f" cx="4" cy="4" r="1.5" /></g>
  <g transform="translate(470, 120)"><path class="d" d="M 4 1 V 7 M 1 4 H 7" /></g>

  <!-- Row 3 gaps -->
  <g transform="translate(85, 205)"><circle class="f" cx="3" cy="3" r="1.6" /><circle class="f" cx="8" cy="10" r="0.9" /></g>
  <g transform="translate(185, 200)"><path class="d" d="M 5 2 V 8 M 2 5 H 8" /></g>
  <g transform="translate(295, 205)"><circle class="f" cx="4" cy="4" r="1.7" /></g>
  <g transform="translate(390, 205)"><circle class="f" cx="3" cy="3" r="1.3" /><circle class="f" cx="9" cy="7" r="1.8" /></g>

  <!-- Row 4 gaps -->
  <g transform="translate(95, 285)"><path class="d" d="M 5 1 V 9 M 1 5 H 9" /></g>
  <g transform="translate(210, 285)"><circle class="f" cx="3" cy="3" r="1.5" /><circle class="f" cx="9" cy="8" r="1" /></g>
  <g transform="translate(315, 285)"><circle class="f" cx="4" cy="4" r="1.8" /></g>
  <g transform="translate(415, 280)"><path class="d" d="M 4 1 V 7 M 1 4 H 7" /></g>

  <!-- Row 5 gaps -->
  <g transform="translate(20, 360)"><circle class="f" cx="3" cy="3" r="1.4" /></g>
  <g transform="translate(100, 365)"><circle class="f" cx="4" cy="4" r="1.6" /></g>
  <g transform="translate(205, 365)"><path class="d" d="M 5 2 V 8 M 2 5 H 8" /></g>
  <g transform="translate(305, 365)"><circle class="f" cx="3" cy="3" r="1.3" /><circle class="f" cx="9" cy="9" r="1.7" /></g>
  <g transform="translate(400, 365)"><circle class="f" cx="4" cy="4" r="1.5" /></g>

  <!-- Row 6 gaps -->
  <g transform="translate(35, 450)"><path class="d" d="M 4 1 V 7 M 1 4 H 7" /></g>
  <g transform="translate(150, 450)"><circle class="f" cx="4" cy="4" r="1.6" /></g>
  <g transform="translate(255, 450)"><circle class="f" cx="3" cy="3" r="1.2" /><circle class="f" cx="9" cy="8" r="1.8" /></g>
  <g transform="translate(365, 450)"><path class="d" d="M 5 2 V 8 M 2 5 H 8" /></g>
  <g transform="translate(470, 455)"><circle class="f" cx="4" cy="4" r="1.5" /></g>

</svg>
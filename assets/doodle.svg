    <path class="d" d="M 4 9 C 4 16 11 16 11 9 Z" />
    <path class="d" d="M 19 9 C 19 16 26 16 26 9 Z" />
  </g>

  <!-- Photo / Image card -->
  <g transform="translate(195, 435) rotate(-8)">
    <rect class="d" x="3" y="3" width="22" height="18" rx="2" />
    <circle class="d" cx="8" cy="8" r="1.8" />
    <path class="d" d="M 4 18 L 11 11 L 18 18 M 15 15 L 18 12 L 24 18" />
  </g>

  <!-- Drink / Soda cup with straw -->
  <g transform="translate(305, 435)">
    <path class="d" d="M 6 8 H 20 L 18 25 H 8 Z" />
    <line class="d" x1="4" y1="8" x2="22" y2="8" />
    <path class="d" d="M 13 8 L 16 1 L 19 2" />

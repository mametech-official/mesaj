    <path class="d" d="M 13 3 A 7 7 0 0 0 6 10 C 6 13 8 15 9 17 H 17 C 18 15 20 13 20 10 A 7 7 0 0 0 13 3 Z" />
  </g>

  <!-- Double Checkmark (WhatsApp ticks) -->
  <g transform="translate(330, 195)">
    <path class="d" d="M 2 14 L 7 19 L 19 6" />
    <path class="d" d="M 9 14 L 14 19 L 26 6" />
  </g>

  <!-- Padlock -->
  <g transform="translate(435, 195)">

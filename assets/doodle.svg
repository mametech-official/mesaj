  <!-- Mobile phone -->
  <g transform="translate(35, 275) rotate(-10)">
    <rect class="d" x="3" y="2" width="16" height="28" rx="3.5" />
    <line class="d" x1="8" y1="5" x2="14" y2="5" />
    <circle class="f" cx="11" cy="26" r="1.3" />
  </g>

  <!-- Gamepad -->
  <g transform="translate(135, 275)">

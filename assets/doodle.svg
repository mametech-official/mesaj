    <circle class="d" cx="5" cy="22" r="2" />
    <circle class="d" cx="2" cy="25" r="1" />
  </g>

  <!-- Compass / Compass Rose -->
  <g transform="translate(345, 355)">
    <circle class="d" cx="14" cy="14" r="12" />
    <polygon class="d" points="14,6 17,14 14,22 11,14" />
    <polygon class="df" points="14,6 17,14 14,14" />
  </g>

  <!-- Bell Notification -->
  <g transform="translate(440, 355)">
    <path class="d" d="M 5 19 H 21 L 19 14 V 9 A 6 6 0 0 0 7 9 V 14 Z" />
    <path class="d" d="M 10 21 A 3 3 0 0 0 16 21" />
    <circle class="f" cx="13" cy="3" r="1" />

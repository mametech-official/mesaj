    <circle class="f" cx="23" cy="12" r="1" />
  </g>

  <!-- Paper Airplane -->
  <g transform="translate(195, 110) rotate(-15)">
    <path class="d" d="M 2 14 L 28 3 L 17 29 L 13 18 Z" />
    <path class="d" d="M 13 18 L 28 3" />
  </g>

  <!-- Smiley face -->
  <g transform="translate(305, 110)">
    <circle class="d" cx="16" cy="16" r="13" />
    <circle class="f" cx="11" cy="13" r="1.5" />
    <circle class="f" cx="21" cy="13" r="1.5" />
    <path class="d" d="M 10 19 Q 16 25 22 19" />
  </g>

  <!-- Headphones -->
  <g transform="translate(405, 115)">
    <path class="d" d="M 4 17 A 12 12 0 0 1 28 17 V 23 A 2 2 0 0 1 26 25 H 24 A 2 2 0 0 1 22 23 V 18 A 2 2 0 0 1 24 16 H 28" />
    <path class="d" d="M 4 17 V 23 A 2 2 0 0 0 6 25 H 8 A 2 2 0 0 0 10 23 V 18 A 2 2 0 0 0 8 16 H 4" />
  </g>

  <!-- Location pin -->
  <g transform="translate(25, 195)">
    <path class="d" d="M 14 2 A 9 9 0 0 0 5 11 C 5 17.5 14 26 14 26 S 23 17.5 23 11 A 9 9 0 0 0 14 2 Z" />
    <circle class="d" cx="14" cy="11" r="3" />
